<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WZ42G8JVS3"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-WZ42G8JVS3');</script>
<title>Сможешь ли ты смотреть фильмы в оригинале? — Chat &amp; Chill</title>
<meta name="description" content="Осенний тест от школы Chat & Chill: проверь, готов ли ты смотреть кино на английском без перевода.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito:wght@800;900&display=swap');
:root{--red:#B3122E;--red-hi:#C8203C;--teal:#24474A;--mist:#E4ECEB;--text:#16201F;--muted:#55706C;--soft:#86A09C;--line:#D5E0DE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;color:var(--text);background:var(--mist);-webkit-font-smoothing:antialiased;min-height:100vh}
.h-nunito{font-family:'Nunito',sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 70px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
header img{height:48px;width:auto}
header a{font-weight:700;font-size:14px;color:var(--muted);text-decoration:none}
.card{background:#fff;border-radius:26px;padding:28px 26px;box-shadow:0 24px 55px -30px rgba(36,71,74,.45);margin-top:18px}
.kicker{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
h1{font-family:'Nunito';font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1.08;letter-spacing:-.8px;margin:10px 0 12px}
.lead{font-size:15.5px;line-height:1.6;color:var(--muted)}
.btn{display:block;width:100%;border:none;cursor:pointer;background:var(--red);color:#fff;font-family:'Manrope';font-weight:700;font-size:16px;padding:15px;border-radius:14px;margin-top:20px;box-shadow:0 10px 24px -10px rgba(179,18,46,.6);text-align:center;text-decoration:none}
.btn.blue{background:var(--teal);box-shadow:0 10px 24px -10px rgba(36,71,74,.6)}
.btn.ghost{background:var(--mist);color:var(--teal);box-shadow:none}
.lvl-pill{display:inline-block;background:var(--mist);color:var(--teal);font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:10px}
video{display:block;width:100%;border-radius:18px;background:#000;margin:14px 0 6px}
.note{font-size:12.5px;color:var(--soft);margin-top:6px}
.joke{font-size:13.5px;font-weight:700;font-style:italic;color:var(--teal);margin-top:8px}
.q{font-family:'Nunito';font-weight:800;font-size:19px;line-height:1.35;letter-spacing:-.3px;margin:20px 0 12px}
.opt{display:block;width:100%;text-align:left;font-family:'Manrope';font-weight:600;font-size:15px;color:var(--text);background:#FBFCFC;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;margin-bottom:9px;transition:border-color .15s}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:var(--mist)}
.prog{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:8px}
.res-big{font-family:'Nunito';font-weight:900;font-size:28px;letter-spacing:-.6px;color:var(--teal);margin:8px 0 10px}
.steps{display:flex;gap:8px;margin-bottom:14px}
.steps span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--red)}
.foot{text-align:center;font-size:12.5px;color:var(--soft);margin-top:24px}
#leaves{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#leaves i{position:absolute;top:-40px;display:block;will-change:transform;animation:leaf-fall linear infinite}
#leaves i svg{display:block;width:100%;height:100%;animation:leaf-sway ease-in-out infinite alternate}
@keyframes leaf-fall{from{transform:translateY(-40px)}to{transform:translateY(calc(100vh + 80px))}}
@keyframes leaf-sway{from{transform:translateX(-26px) rotate(-35deg)}to{transform:translateX(26px) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){#leaves{display:none}}
.wrap{position:relative;z-index:1}
.draft{background:#FFF6EE;border:1px solid #FFE0C4;color:#8A4B10;border-radius:14px;padding:12px 16px;font-size:13.5px;line-height:1.5;margin-top:16px}
</style>
</head>
<body>
<div id="leaves" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a href="https://chill.education/"><img src="../img/logo.png" alt="Chat and Chill"></a>
    <a href="https://chill.education/?utm_source=filmtest&utm_medium=referral&utm_campaign=header">На сайт школы</a>
  </header>

  <div class="card" id="screen"></div>

  <p class="foot">🎃 Тест по «Сумеркам» · Chat &amp; Chill</p>
</div>

<script>
(function leaves(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.getElementById('leaves');
  const colors=['#B3122E','#8E2A1E','#C2662B','#A8842F','#6E3B23'];
  const maple='M12 1l1.6 3.8 2.6-1.3-.6 4.4 3.6-1.7-.9 3 3.7.6-3 2.7 1.4 1.6-4.6.6.4 2.3-3.4-1.3V22h-1.6v-6.3l-3.4 1.3.4-2.3-4.6-.6 1.4-1.6-3-2.7 3.7-.6-.9-3 3.6 1.7-.6-4.4 2.6 1.3z';
  const simple='M3 21C3 11 9 4 21 3c-1 12-8 18-18 18z';
  const leafSvg=(k,extra)=>`<svg viewBox="0 0 24 24"${extra||''}>${k%2?`<path fill="${colors[k%colors.length]}" d="${maple}"/>`:`<path fill="${colors[k%colors.length]}" d="${simple}"/><path d="M4 20L15 9" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none"/>`}</svg>`;
  const n=window.innerWidth<600?10:16;
  const list=[];
  for(let k=0;k<n;k++){
    const el=document.createElement('i');
    const size=16+Math.random()*16;
    el.style.left=(Math.random()*100)+'vw';
    el.style.width=el.style.height=size+'px';
    el.style.opacity=(.45+Math.random()*.35).toFixed(2);
    el.style.animationDuration=(11+Math.random()*10)+'s';
    el.style.animationDelay=(-Math.random()*20)+'s';
    el.innerHTML=leafSvg(k,` style="animation-duration:${(2.5+Math.random()*2.5).toFixed(1)}s"`);
    box.appendChild(el);
    list.push({el,svg:el.firstChild,dx:0,spin:0,timer:0});
  }

  // касание: ближайшие листья отлетают, из точки вылетает горстка новых
  let flying=0;
  function burst(x,y){
    const count=window.innerWidth<600?5:7;
    for(let j=0;j<count&&flying<28;j++){
      const el=document.createElement('i');
      const size=12+Math.random()*12;
      el.style.cssText=`left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px;animation:none;opacity:.9`;
      el.innerHTML=leafSvg(Math.floor(Math.random()*10),' style="animation:none"');
      box.appendChild(el); flying++;
      const ang=Math.random()*Math.PI*2, sp=70+Math.random()*90;
      const vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp-50, rot=(Math.random()<.5?-1:1)*(180+Math.random()*360);
      el.animate([
        {transform:'translate(0,0) rotate(0deg)',opacity:.9},
        {transform:`translate(${vx}px,${vy}px) rotate(${rot*.6}deg)`,opacity:.85,offset:.45},
        {transform:`translate(${vx*1.3}px,${vy+140}px) rotate(${rot}deg)`,opacity:0}
      ],{duration:1300+Math.random()*600,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>{el.remove();flying--;};
    }
  }
  function scatter(x,y){
    const R=window.innerWidth<600?170:220;
    list.forEach(L=>{
      const r=L.el.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const d=Math.hypot(cx-x,cy-y)||1;
      if(d>R) return;
      const f=(1-d/R)*240;
      const base=parseFloat(L.el.style.left)/100*window.innerWidth;
      L.dx=Math.max(-base+10,Math.min(window.innerWidth-base-30,L.dx+(cx-x)/d*f));
      L.spin+=(Math.random()<.5?-1:1)*(120+Math.random()*200);
      const lift=(cy-y)/d*f*.6-60;
      L.el.style.transition='translate 1.1s cubic-bezier(.15,.75,.3,1)';
      L.svg.style.transition='rotate 1.4s cubic-bezier(.15,.75,.3,1)';
      L.el.style.translate=`${L.dx}px ${lift}px`;
      L.svg.style.rotate=`${L.spin}deg`;
      clearTimeout(L.timer);
      L.timer=setTimeout(()=>{ L.el.style.transition='translate 5s ease-out'; L.el.style.translate=`${L.dx}px 0px`; },1200);
    });
  }
  document.addEventListener('pointerdown',e=>{
    scatter(e.clientX,e.clientY);
    if(!e.target.closest('button,a,video,input,.opt')) burst(e.clientX,e.clientY);
  },{passive:true});
})();
function track(n,p){try{gtag('event',n,p||{})}catch(e){}}
const PASS = 4; // от скольких правильных из 5 считаем уровень пройденным (на следующий уровень пускаем в любом случае)

// ЧЕРНОВИК: вопросы сгенерированы по сцене, проверить и поправить с Демидом.
const LEVELS = [
  {
    title: 'Уровень 1 · Разминка', clip: 'clip1.mp4?v=1',
    hint: 'Посмотри фрагмент (можно дважды) и выполни задания.',
    joke: 'Если тяжело смотреть на игру Кристен Стюарт, крепись: Эдвард ждал её больше ста лет 🧛',
    questions: [
      { type:'mc', q:'С чего Эдвард начинает разговор?', o:['Спрашивает, нравится ли ей дождь','Приглашает её в кино','Спрашивает про домашнее задание','Делает комплимент её причёске'], a:0 },
      { type:'who', q:'Кто говорит: «You\'re asking me about the weather?»', a:1 },
      { type:'tf', q:'Белла говорит, что ей нравится дождь.', a:1 },
      { type:'order', q:'Расставь реплики в том порядке, как они звучат:', lines:['So you\'re enjoying the rain?','You\'re asking me about the weather?','Yeah, I guess I am.','Well, I don\'t really like the rain.'] },
      { type:'mc', q:'Что ещё не нравится Белле, по её словам?', o:['Жара и солнце','Любые холодные и мокрые вещи — «any cold, wet thing»','Снег и лёд','Сильный ветер'], a:1 },
    ],
  },
  {
    title: 'Уровень 2 · Средняя сложность', clip: 'clip2.mp4?v=1',
    hint: 'Речь быстрее, реплик больше. Слушай, кто что говорит.',
    questions: [
      { type:'mc', q:'Какой главный вопрос Белла задаёт в начале разговора?', o:['Почему он опоздал на урок','Как он так быстро оказался рядом с ней','Где он был вчера вечером','Почему он с ней не разговаривает'], a:1 },
      { type:'who', q:'Кто говорит: «I was standing right next to you»', a:0 },
      { type:'gap', q:'Заполни пропуск: «Can\'t you just ___ me and get over it?»', o:['thank','forgive','trust','help'], a:0 },
      { type:'order', q:'Расставь реплики в том порядке, как они звучат:', lines:['How did you get over to me so fast?','I was standing right next to you.','I know what I saw.','I hope you enjoy disappointment.'] },
      { type:'who', q:'Кто говорит: «I wasn\'t gonna tell anybody»', a:1 },
    ],
  },
  {
    title: 'Уровень 3 · Как носитель', clip: 'clip3.mp4?v=1',
    hint: 'Финал: тихая быстрая речь и длинный монолог Эдварда. Следи за смыслом и за тем, кто что говорит.',
    questions: [
      { type:'tf', q:'В начале сцены Эдвард говорит Белле, что она красивая.', a:1 },
      { type:'who', q:'Кто говорит: «I don\'t believe that»', a:1 },
      { type:'mc', q:'Как Эдвард объясняет, почему он кажется Белле привлекательным?', o:['Это маскировка, чтобы заманить жертву','Он просто хорошо выглядит от природы','Так на него действует солнце','Это заслуга его семьи'], a:0 },
      { type:'order', q:'Расставь реплики Эдварда в том порядке, как они звучат:', lines:['I\'m the world\'s most dangerous predator.','Everything about me invites you in.','As if you could outrun me!','I\'m designed to kill.'] },
      { type:'mc', q:'Эдвард признаётся, что уже убивал людей. Что отвечает Белла?', o:['Что ей страшно','Что это не имеет значения','Что она ему не верит','Что ей нужно уйти'], a:1 },
    ],
  },
];

let lvl = 0, qi = 0, correct = 0, chosen = null;
const S = document.getElementById('screen');

// полоски-ступени кликабельны: можно перейти на любой уровень
function stepsHtml(){ return '<div class="steps">'+LEVELS.map((_,i)=>`<span class="${i<=lvl?'on':''}" onclick="startLevel(${i})" style="cursor:pointer" title="Уровень ${i+1}"></span>`).join('')+'</div>'; }

function intro(){
  S.innerHTML = `
    <span class="kicker">🎃 Тест по «Сумеркам» · 5 минут</span>
    <h1>Сможешь ли ты смотреть фильмы в оригинале?</h1>
    <p class="lead">Три фрагмента из известного фильма — от простого к сложному. Смотри без субтитров и отвечай на вопросы. Пройдёшь все три уровня — значит, пора выключать перевод навсегда.</p>
    <button class="btn" onclick="startLevel(0)">Начать</button>
    <p class="note" style="text-align:center;margin-top:16px">Или выбери уровень сразу:</p>
    <div style="display:flex;gap:10px">
      ${LEVELS.map((L,i)=>`<button class="opt" style="flex:1;width:auto;min-width:0;margin-bottom:0;padding:13px 4px;font-size:14px;white-space:nowrap;text-align:center;font-weight:700" onclick="startLevel(${i})">Уровень ${i+1}</button>`).join('')}
    </div>`;
}

function startLevel(i){
  lvl = i; qi = 0; correct = 0;
  const L = LEVELS[i];
  if(!L.clip){
    S.innerHTML = `${stepsHtml()}<span class="lvl-pill">${L.title}</span>
      <h1>Фрагмент в производстве</h1>
      <p class="lead">Для этого уровня ещё не загружен видеофрагмент. Запиши его — и тест продолжится отсюда.</p>
      <button class="btn blue" onclick="result(true)">Показать экран результата (для проверки)</button>`;
    return;
  }
  track('filmtest_level_start',{level:i+1});
  // видео живёт вне #qa: при переходе между вопросами не перерисовывается и остаётся на экране
  S.innerHTML = `${stepsHtml()}<span class="lvl-pill">${L.title}</span>
    <p class="lead">${L.hint}</p>
    <video src="${L.clip}" controls playsinline></video>
    <div id="qa">
      <p class="note">Смотри без пауз на вопросах — как в настоящем кино. Видео останется на экране — можно пересматривать.</p>${L.joke?`<p class="joke">${L.joke}</p>`:''}
      <button class="btn" onclick="renderQ()">К вопросам</button>
    </div>`;
}

function renderQ(){
  const L = LEVELS[lvl], Q = L.questions[qi];
  const box = document.getElementById('qa');
  const head = `
    <div class="prog">Задание ${qi+1} из ${L.questions.length}</div>
    <div class="q">${Q.q}</div>`;
  const nextBtn = `<button class="btn" id="next" style="opacity:.5" disabled>Ответить</button>`;
  const enable = ()=>{ const n=document.getElementById('next'); n.disabled=false; n.style.opacity=1; };
  const finish = ok=>{ if(ok) correct++; qi++; if(qi<L.questions.length) renderQ(); else levelDone(); };

  if(Q.type==='mc' || Q.type==='gap'){
    box.innerHTML = head + Q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('') + nextBtn;
    let chosen=null;
    document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=+b.dataset.i; enable();
    }));
    document.getElementById('next').addEventListener('click',()=>{ if(chosen!==null) finish(chosen===Q.a); });
  }
  else if(Q.type==='who' || Q.type==='tf'){
    const opts = Q.type==='who' ? ['🧛 Эдвард','👧 Белла'] : ['✔️ Правда','✖️ Ложь'];
    box.innerHTML = head + `<div style="display:flex;gap:10px">` +
      opts.map((o,i)=>`<button class="opt" style="flex:1;text-align:center;font-size:16px;padding:18px" data-i="${i}">${o}</button>`).join('') + `</div>` + nextBtn;
    let chosen=null;
    document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); chosen=+b.dataset.i; enable();
    }));
    document.getElementById('next').addEventListener('click',()=>{ if(chosen!==null) finish(chosen===Q.a); });
  }
  else if(Q.type==='order'){
    const idx = Q.lines.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    let picked=[];
    box.innerHTML = head +
      `<div id="ord-list">` + idx.map(i=>`<button class="opt" data-i="${i}"><span class="ord-n" style="display:inline-block;min-width:24px;font-weight:800;color:var(--red-hi)"></span>${Q.lines[i]}</button>`).join('') + `</div>
      <button class="opt" id="ord-reset" style="text-align:center;color:var(--teal);font-weight:700;background:var(--mist);border-color:var(--mist)">Сбросить порядок</button>` + nextBtn;
    const refresh=()=>{ document.querySelectorAll('#ord-list .opt').forEach(b=>{
        const pos=picked.indexOf(+b.dataset.i);
        b.querySelector('.ord-n').textContent = pos>=0 ? (pos+1)+'.' : '';
        b.classList.toggle('sel',pos>=0);
      });
      if(picked.length===Q.lines.length) enable(); };
    document.querySelectorAll('#ord-list .opt').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.i; if(picked.includes(i)) return; picked.push(i); refresh();
    }));
    document.getElementById('ord-reset').addEventListener('click',()=>{ picked=[]; refresh(); const n=document.getElementById('next'); n.disabled=true; n.style.opacity=.5; });
    document.getElementById('next').addEventListener('click',()=>{
      if(picked.length!==Q.lines.length) return;
      finish(picked.every((v,k)=>v===k));
    });
  }
  else if(Q.type==='input'){
    box.innerHTML = head + `<input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.ph||'Впиши слово'}" style="width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-family:'Manrope';font-size:16px;background:#FBFCFC;color:var(--text);outline:none">` + nextBtn;
    const inp=document.getElementById('inp');
    inp.addEventListener('input',()=>{ if(inp.value.trim()) enable(); });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value.trim()) document.getElementById('next').click(); });
    document.getElementById('next').addEventListener('click',()=>{
      const v=inp.value.trim().toLowerCase().replace(/[^a-zа-яё]/gi,'');
      if(!v) return;
      finish(Q.answers.some(ans=>v===ans.toLowerCase()));
    });
    inp.focus();
  }
}

function levelDone(){
  const L = LEVELS[lvl];
  const passed = correct >= PASS;
  track('filmtest_level_done',{level:lvl+1,correct,passed});
  if(lvl < LEVELS.length-1){
    const praise = passed ? '— отлично! 🎉' : '— идём дальше!';
    const note = passed
      ? 'Ты понял(а) этот фрагмент. Дальше — сложнее: быстрее речь, больше разговорных фраз.'
      : 'Кое-что ускользнуло — это нормально, на слух язык ловится с практикой. Дальше — сложнее: быстрее речь, больше разговорных фраз.';
    S.innerHTML = `${stepsHtml()}<span class="lvl-pill">${L.title}</span>
      <h1>${correct} из ${L.questions.length} ${praise}</h1>
      <p class="lead">${note}</p>
      <button class="btn" onclick="startLevel(${lvl+1})">Следующий уровень</button>`;
  } else {
    result(passed);
  }
}

function result(champion){
  track('filmtest_result',{level:lvl+1,correct,champion:!!champion});
  const headline = champion
    ? 'Ты готов(а) смотреть кино в оригинале! 🏆'
    : (lvl===0 ? 'Хорошее начало — фильмы уже близко!' : 'Почти получилось — чуть-чуть практики!');
  const text = champion
    ? 'Все уровни пройдены: субтитры тебе больше не нужны. Хочешь понимать так любой фильм, а не только знакомые сцены? В Chat & Chill мы учим именно живому языку из кино и сериалов.'
