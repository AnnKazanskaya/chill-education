function track(e,p){try{window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:e,...p});}catch(x){}try{if(typeof window.gtag==="function")window.gtag("event",e,p||{});}catch(x){}try{console.log("[GA4]",e,p||{});}catch(x){}}

function buildSlots(){
  const now=Date.now(),LAG=12*3600*1000,hoursUTC=[9,10,11,14,15,16],out=[];
  const base=new Date();base.setUTCHours(0,0,0,0);
  for(let d=0;d<14;d++){const day=new Date(base.getTime()+d*86400000),dow=day.getUTCDay(),slots=[];
    if(dow!==0&&dow!==6){hoursUTC.forEach((h,i)=>{const t=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h);
      if(t<now+LAG)return; if(((d*5+i*3)%10)<4)return; slots.push(t);});}
    out.push({ts:day.getTime(),slots});}
  return out;
}

                  <li>Цена меняется дважды в год на 10% (сентябрь и декабрь).</li>
                  <li>Решил закончить — предупреди за 2 недели.</li>
                </ul>
              </div>
            </details>
            <button className="btnp y" onClick={start}>Выбрать время для вводного</button>
          </div>
        </>)}

        {flow==="slots"&&(
          <div className="sec">
            <button className="backp" onClick={()=>setFlow(null)}>← на главную</button>
            <div className="tag y">Шаг 1 из 3</div>
            <Ransom text="Выбери удобное время"/>
            <p className="p small">🕒 Время указано по Москве (МСК).</p>
            <div className="days">
              {days.map((d,i)=>(
                <div key={d.ts} className={"dayp"+(i===dayIdx?" sel":"")+(d.slots.length?"":" empty")} onClick={()=>d.slots.length&&setDayIdx(i)}>
                  <div className="dw">{fW(d.ts)}</div><div className="dd">{fD(d.ts)}</div><div className="dn">{d.slots.length?d.slots.length+" ок.":"—"}</div>
                </div>
              ))}
            </div>
            {days[dayIdx]&&days[dayIdx].slots.length?(
              <div className="slots">{days[dayIdx].slots.map(ts=><div key={ts} className="slotp" onClick={()=>pick(ts)}>{fT(ts)}</div>)}</div>
            ):<p className="p small" style={{textAlign:"center"}}>выбери день со свободными окнами</p>}
          </div>
        )}

        {flow==="questions"&&(
          <div className="sec">
            <button className="backp" onClick={()=>setFlow("slots")}>← другое время</button>
            <div className="timerp">⏳ время держим за тобой: <b>{mm}:{ss}</b></div>
            <div className="rowp">вводное · {slot?fFull(slot):""}</div>
            <Ransom text="Пара вопросов перед стартом"/>
            <p className="p small">Это поможет мне подготовиться к нашему первому уроку.</p>
            <form onSubmit={submitQ}>
              <div className="lbl">Как ты оцениваешь свой уровень?</div>
              <select className="sel2" required value={q.level} onChange={e=>setQ(v=>({...v,level:e.target.value}))}>
                <option value="" disabled>выбери…</option>
                <option>Начинающий</option><option>A1–A2</option><option>B1–B2</option><option>C1 и выше</option><option>Не знаю</option>
              </select>
              <div className="lbl">Для чего тебе английский?</div>
              <input className="inp" required value={q.why} onChange={e=>setQ(v=>({...v,why:e.target.value}))} placeholder="работа, путешествия, переезд…"/>
              <div className="lbl">Куда прислать доступы?</div>
              <input className="inp" required type="email" value={q.email} onChange={e=>setQ(v=>({...v,email:e.target.value}))} placeholder="you@mail.ru" autoComplete="email"/>
              <label className="consent">
                <input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} required/>
                <span>Согласен(на) с <a href="https://chill.education/policy.html" target="_blank" rel="noopener">политикой</a> и <a href="https://chill.education/offer.html" target="_blank" rel="noopener">офертой</a></span>
              </label>
              <div style={{height:12}}/>
              <button className="btnp" type="submit" disabled={!consent}>Перейти к оплате</button>
            </form>
          </div>
        )}

        {flow==="pay"&&(
          <div className="sec">
            <button className="backp" onClick={()=>setFlow("questions")}>← назад</button>
            <div className="timerp">⏳ время держим за тобой: <b>{mm}:{ss}</b></div>
            <Ransom text="Сколько это стоит"/>
            <div className="cur">{Object.keys(PRICES).map(k=><button key={k} className={ccy===k?"on":""} onClick={()=>setCcy(k)}>{PRICES[k].c}</button>)}</div>
            <div className="pricep"><b>{P.intro} {P.c}</b><span className="strike">{P.lesson} {P.c}</span><span className="scrib">вводное −50%</span></div>
            <div className="rowp">вводное · {slot?fFull(slot):""}</div>
            <div className="lbl">Как оплата устроена</div>
            <ul className="listp">
              <li>Оплата за месяц вперёд (2 раза в неделю → 8 уроков).</li>
              <li>Оплаченные уроки действуют 2 месяца.</li>
              <li>Слот закрепляется только после оплаты.</li>
            </ul>
            <button className="btnp" onClick={pay}>Оплатить и записаться</button>
            <div style={{height:10}}/>
            <button className="btnp w" onClick={contact} style={{fontSize:13,padding:10}}>связаться — если с оплатой что-то не так</button>
            <p className="p small" style={{textAlign:"center",marginTop:10}}>демо-кнопка · на боевом сайте здесь оплата</p>
          </div>
        )}

        {flow==="done"&&(
          <div className="sec">
            <div className="okbox">
              <div className="tag y" style={{transform:"rotate(-2deg)"}}>✓ done</div>
              <Ransom text="Готово ты записан"/>
              <p className="p">Всё прошло, жду тебя на уроке. Скинул на почту <b>{q.email||"—"}</b> доступ к платформе, ссылку на Zoom и добавил урок в календарь.</p>
              <div className="rowp" style={{textAlign:"left"}}>вводное · {slot?fFull(slot):""}</div>
            </div>
            <div className="lbl">Что придёт на почту</div>
            <ul className="listp">
              <li>Доступ к интерактивной платформе (логин и пароль)</li>
              <li>Постоянная ссылка на Zoom</li>
              <li>Событие в календарь с датой и временем урока</li>
            </ul>
            <p className="p small">Перед уроком проверь, что интернет и связь работают стабильно. До встречи.</p>
            <button className="btnp w" onClick={()=>{setFlow(null);setSlot(null);setConsent(false);}}>на главную</button>
          </div>
        )}

        {flow==="noslots"&&(
          <div className="sec">
            <button className="backp" onClick={()=>setFlow(null)}>← на главную</button>
            <div className="tag p">Свободных окон нет</div>
            <Ransom text="Сейчас у меня всё занято"/>
            <p className="p">У меня ограниченное расписание, и свободные окна бывают не всегда. Но есть <span className="hl">преподаватели моей школы</span> — те же материалы и та же методика. Подход будет тот же. Вводный урок у них <span className="hlp">бесплатный</span>.</p>
            <button className="btnp" onClick={goSchool}>Записаться к преподавателям школы →</button>
          </div>
        )}

        <div className="tear"/>
        <div style={{background:"#141414",color:"#777",fontSize:11,fontFamily:"'PT Mono',monospace",textAlign:"center",padding:"16px 12px 26px"}}>
          Chat &amp; Chill · <a href="https://chill.education/policy.html" style={{color:"#999"}}>политика</a> · <a href="https://chill.education/offer.html" style={{color:"#999"}}>оферта</a>
        </div>
      </div>

      <div className="demo">
        панк-прототип · демо-данные
        <button onClick={()=>{setForceNo(v=>!v);setFlow(!forceNo?"noslots":null);window.scrollTo(0,0);}}>{forceNo?"со слотами":"«нет слотов»"}</button>
        <a href="./" style={{color:"#F7E017"}}>← брендовая версия</a>
      </div>
    </div>
  );
}

document.getElementById("boot").style.display="none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
