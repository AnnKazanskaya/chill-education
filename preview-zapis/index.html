  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,BlinkMacSystemFont,'Manrope',sans-serif;background:#EEF0FB;z-index:9999}

<body>
<div id="boot"><img src="https://chill.education/img/logo.png" alt="Chat and Chill"><div class="d"><span></span><span></span><span></span></div></div>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   Chat & Chill — запись на вводное занятие (ПРОТОТИП)
   Данные слотов — демонстрационные. Календарь, оплата и письма
   подключаются к бэкенду на следующем этапе.

const CSS = `

.bk-bs{font-size:12px;color:var(--ink-soft)}

.bk-eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.bk-h1{font-family:var(--fd);font-weight:900;font-size:27px;line-height:1.1;letter-spacing:-.5px;margin:10px 0 12px}
.bk-p{font-size:15px;line-height:1.55;color:var(--ink-soft);margin:0 0 16px}
.bk-facts{display:flex;flex-direction:column;gap:9px;margin:0 0 20px}

.bk-price .free{color:var(--accent);font-weight:700;font-size:14px;background:#FFEEDD;padding:3px 10px;border-radius:999px}
.bk-btn{display:block;width:100%;text-align:center;font-family:var(--fd);font-weight:800;font-size:16px;color:#fff;background:var(--primary);border:none;border-radius:14px;padding:15px;cursor:pointer;box-shadow:0 12px 24px -10px rgba(36,64,217,.7);transition:background .15s,transform .06s}
.bk-btn:hover{background:var(--primary-deep)}

.bk-btn-acc{background:var(--accent);box-shadow:0 12px 24px -10px rgba(255,122,26,.7)}
.bk-btn-acc:hover{background:#E86A00}
.bk-ghost{background:none;color:var(--primary);border:1.5px solid var(--line);box-shadow:none}
.bk-ghost:hover{background:var(--primary-tint)}
.bk-back{background:none;border:none;color:var(--ink-soft);font-family:var(--fb);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:6px}
.bk-step{font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-weight:600}
.bk-tz{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bk-tz select{font-family:var(--fb);font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff}
.bk-days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px}
.bk-day{flex:0 0 auto;min-width:58px;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px;cursor:pointer;background:#FCFBFF;transition:border-color .15s,background .15s}
.bk-day.sel{border-color:var(--primary);background:var(--primary-tint)}
.bk-day.empty{opacity:.4;cursor:not-allowed}
.bk-day .dw{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.bk-day .dd{font-family:var(--fd);font-weight:800;font-size:18px;margin-top:2px}
.bk-day .dn{font-size:10.5px;color:var(--ok);margin-top:2px;font-weight:700}
.bk-day.empty .dn{color:var(--ink-soft)}
.bk-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.bk-slot{border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;background:#FCFBFF;transition:border-color .15s,background .15s}
.bk-slot:hover{border-color:#C9D2F5;background:#F5F7FF}

.bk-timer{display:flex;align-items:center;gap:8px;background:#FFF6EE;border:1px solid #FFE0C4;border-radius:12px;padding:10px 12px;font-size:13px;color:#8A4B10;margin:0 0 16px}
.bk-timer b{font-variant-numeric:tabular-nums;font-family:var(--fd)}
.bk-lbl{font-size:13px;font-weight:700;color:#3A3F5A;margin:14px 0 6px}
.bk-inp,.bk-sel,.bk-ta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--fb);font-size:15px;color:var(--ink);background:#FCFBFF}
.bk-inp:focus,.bk-sel:focus,.bk-ta:focus{outline:none;border-color:var(--primary)}
.bk-row{background:var(--primary-tint);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:14px}
.bk-row b{font-family:var(--fd)}
.bk-consent{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.4;color:var(--ink-soft);margin:14px 0 4px;cursor:pointer}
.bk-consent input{margin-top:1px;width:16px;height:16px;accent-color:var(--primary);flex:0 0 auto}
.bk-consent a{color:var(--primary)}
.bk-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:12px;line-height:1.5}
.bk-demo{position:fixed;left:0;right:0;bottom:0;background:#1A1E33;color:#fff;font-size:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:50}
.bk-demo button{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-family:var(--fb);font-size:12px;cursor:pointer}
.bk-ok-ic{width:56px;height:56px;border-radius:50%;background:#E9F7EE;color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
@media(max-width:380px){.bk-slots{grid-template-columns:repeat(2,1fr)}}
`;

const TZ_OPTS = [
  { id:"Europe/Moscow", label:"Москва (MSK)" },
  { id:"Asia/Almaty", label:"Астана / Алматы" },
  { id:"Asia/Yekaterinburg", label:"Екатеринбург" },
  { id:"Europe/Kiev", label:"Киев" },
  { id:"Europe/London", label:"Лондон" },
];
const PRICE = { intro: "2 250 ₽", regular: "4 500 ₽" }; // ДЕМО — финальные цифры от владельца

/* ------- события воронки (GA4) ------- */
function track(event, params){
  try{ window.dataLayer = window.dataLayer||[]; window.dataLayer.push({ event, ...params }); }catch(e){}
  try{ if(typeof window.gtag==="function") window.gtag("event", event, params||{}); }catch(e){}
  try{ console.log("[GA4]", event, params||{}); }catch(e){}
}

/* ------- демо-слоты: рабочие часы владельца (Лондон) в UTC, на 14 дней ------- */
function buildSlots(){
  const now = Date.now();
  const MIN_LAG = 12*3600*1000; // нельзя записаться раньше чем за 12 ч
  const workHoursUTC = [8,9,10,11,14,15,16,17]; // ~рабочие часы владельца
  const days = [];
  const base = new Date(); base.setUTCHours(0,0,0,0);
  for(let d=0; d<14; d++){
    const day = new Date(base.getTime() + d*86400000);
    const dow = day.getUTCDay();
    const slots = [];
    if(dow!==0 && dow!==6){ // будни
      workHoursUTC.forEach((h,idx)=>{
        const t = Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), h);
        if(t < now + MIN_LAG) return;
        // детерминированная «занятость» ~35%
        const busy = ((d*7 + idx*3) % 10) < 3;
        if(!busy) slots.push(t);
      });
    }
    days.push({ ts: day.getTime(), slots });
  }
  return days;
}

function fmtTime(ts, tz){ return new Intl.DateTimeFormat("ru-RU",{ timeZone:tz, hour:"2-digit", minute:"2-digit" }).format(new Date(ts)); }
function fmtDay(ts, tz){ return new Intl.DateTimeFormat("ru-RU",{ timeZone:tz, weekday:"short" }).format(new Date(ts)); }
function fmtDayNum(ts, tz){ return new Intl.DateTimeFormat("ru-RU",{ timeZone:tz, day:"numeric" }).format(new Date(ts)); }
function fmtFull(ts, tz){ return new Intl.DateTimeFormat("ru-RU",{ timeZone:tz, weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" }).format(new Date(ts)); }

function App(){
  const [step, setStep] = useState("landing"); // landing|calendar|form|pay|done|noslots
  const [tz, setTz] = useState(()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Moscow"; }catch(e){ return "Europe/Moscow"; } });
  const [forceNoSlots, setForceNoSlots] = useState(false);
  const days = useMemo(()=>buildSlots(),[]);
  const hasAny = days.some(d=>d.slots.length>0) && !forceNoSlots;
  const [dayIdx, setDayIdx] = useState(()=> days.findIndex(d=>d.slots.length>0));
  const [slot, setSlot] = useState(null);
  const [deadline, setDeadline] = useState(null);
  const [left, setLeft] = useState(900);
  const [form, setForm] = useState({ name:"", email:"", tg:"", level:"", why:"", how:"" });
  const [consent, setConsent] = useState(false);
  const startedForm = useRef(false);

  useEffect(()=>{ track("view_page"); },[]);

  // таймер брони 15 мин
  useEffect(()=>{
    if(!deadline) return;
    const id = setInterval(()=>{
      const s = Math.max(0, Math.round((deadline - Date.now())/1000));
      setLeft(s);
      if(s<=0){ clearInterval(id); setSlot(null); setDeadline(null); setStep("calendar"); }
    }, 1000);
    return ()=>clearInterval(id);
  },[deadline]);

  const goCalendar = ()=>{ track("open_calendar"); setStep(hasAny? "calendar":"noslots"); };
  const pickSlot = (ts)=>{
    setSlot(ts); track("select_slot", { slot:new Date(ts).toISOString() });
    const dl = Date.now()+15*60*1000; setDeadline(dl); setLeft(900); setStep("form");
  };
  const submitForm = (e)=>{
    e.preventDefault();
    if(!consent) return;
    track("submit_form", { level:form.level });
    setStep("pay");
  };
  const pay = ()=>{ track("begin_checkout"); setTimeout(()=>{ track("purchase"); setDeadline(null); setStep("done"); }, 600); };
  const goSchool = ()=>{
    track("go_to_school");
    window.open("https://chill.education/?utm_source=booking&utm_medium=referral&utm_campaign=no_slots","_blank","noopener");
  };

  const mm = String(Math.floor(left/60)).padStart(2,"0"), ss = String(left%60).padStart(2,"0");

  return (
    <div className="bk">
      <style>{CSS}</style>
      <div className="bk-shell">
        <div className="bk-brand">
          <img src="https://chill.education/img/logo.png" alt="Chat and Chill" />
          <div className="bk-bs">Английский без стресса</div>
        </div>

        {/* LANDING */}
        {step==="landing" && (
          <div className="bk-card">
            <div className="bk-eyebrow">Вводное занятие · онлайн</div>
            <h1 className="bk-h1">Познакомимся и определим твой уровень за одно занятие</h1>
            <p className="bk-p">Я послушаю твою речь, разберём цели и покажу, как будет проходить обучение — без стресса и зубрёжки. Выбери удобное время ниже.</p>
            <div className="bk-facts">
              <div className="bk-fact"><span className="bk-fdot">1</span><span>Живой урок 1-на-1 по видеосвязи, 45 минут.</span></div>
              <div className="bk-fact"><span className="bk-fdot">2</span><span>Определим уровень и составим план под твою цель.</span></div>
              <div className="bk-fact"><span className="bk-fdot">3</span><span>После оплаты сразу придёт ссылка на Zoom и файл для календаря.</span></div>
            </div>
            <div className="bk-price"><b>{PRICE.intro}</b><s>{PRICE.regular}</s><span className="free">вводное · −50%</span></div>
            <button className="bk-btn" onClick={goCalendar}>Выбрать время</button>
          </div>
        )}

        {/* CALENDAR */}
        {step==="calendar" && (
          <div className="bk-card">
            <div className="bk-step">Шаг 1 из 3 · выбор времени</div>
            <div className="bk-tz">🌍 Время показано в поясе:
              <select value={tz} onChange={e=>setTz(e.target.value)}>
                {TZ_OPTS.find(o=>o.id===tz) ? null : <option value={tz}>{tz}</option>}
                {TZ_OPTS.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
              </select>
            </div>
            <div className="bk-days">
              {days.map((d,i)=>(
                <div key={d.ts} className={"bk-day"+(i===dayIdx?" sel":"")+(d.slots.length?"":" empty")}
                     onClick={()=>d.slots.length&&setDayIdx(i)}>
                  <div className="dw">{fmtDay(d.ts,tz)}</div>
                  <div className="dd">{fmtDayNum(d.ts,tz)}</div>
                  <div className="dn">{d.slots.length? d.slots.length+" оконⁿ".replace("ⁿ",""):"—"}</div>
                </div>
              ))}
            </div>
            {dayIdx>=0 && days[dayIdx] ? (
              <div className="bk-slots">
                {days[dayIdx].slots.map(ts=>(
                  <div key={ts} className={"bk-slot"+(slot===ts?" sel":"")} onClick={()=>pickSlot(ts)}>{fmtTime(ts,tz)}</div>
                ))}
              </div>
            ) : <div className="bk-empty">Выбери день со свободными окнами</div>}
          </div>
        )}

        {/* FORM */}
        {step==="form" && (
          <div className="bk-card">
            <button className="bk-back" onClick={()=>setStep("calendar")}>← Другое время</button>
            <div className="bk-timer">⏳ Время держим за тобой: <b>{mm}:{ss}</b></div>
            <div className="bk-row">Вводное занятие · <b>{slot? fmtFull(slot,tz):""}</b></div>
            <form onSubmit={submitForm} onChange={()=>{ if(!startedForm.current){ startedForm.current=true; track("begin_form"); } }}>
              <div className="bk-lbl">Как тебя зовут?</div>
              <input className="bk-inp" required value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Имя" autoComplete="name" />
              <div className="bk-lbl">Email <span style={{color:"#9AA0B8",fontWeight:400}}>(туда придёт ссылка и .ics)</span></div>
              <input className="bk-inp" required type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="you@mail.ru" autoComplete="email" />
              <div className="bk-lbl">Telegram</div>
              <input className="bk-inp" value={form.tg} onChange={e=>setForm(f=>({...f,tg:e.target.value}))} placeholder="@username" />
              <div className="bk-lbl">Твой уровень английского</div>
              <select className="bk-sel" required value={form.level} onChange={e=>setForm(f=>({...f,level:e.target.value}))}>
                <option value="" disabled>Выбери…</option>
                <option>Начинаю с нуля</option><option>A2</option><option>B1</option><option>B2</option><option>C1+</option><option>Не знаю</option>
              </select>
              <div className="bk-lbl">Зачем тебе английский?</div>
              <input className="bk-inp" value={form.why} onChange={e=>setForm(f=>({...f,why:e.target.value}))} placeholder="Работа, переезд, путешествия…" />
              <div className="bk-lbl">Как учил раньше? <span style={{color:"#9AA0B8",fontWeight:400}}>(необязательно)</span></div>
              <input className="bk-inp" value={form.how} onChange={e=>setForm(f=>({...f,how:e.target.value}))} placeholder="Школа, репетитор, приложения…" />
              <label className="bk-consent">
                <input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} required />
                <span>Я соглашаюсь с <a href="https://chill.education/policy.html" target="_blank" rel="noopener">политикой конфиденциальности</a> и <a href="https://chill.education/offer.html" target="_blank" rel="noopener">офертой</a></span>
              </label>
              <button className="bk-btn" type="submit" disabled={!consent} style={{marginTop:12}}>Перейти к оплате</button>
            </form>
          </div>
        )}

        {/* PAY */}
        {step==="pay" && (
          <div className="bk-card">
            <button className="bk-back" onClick={()=>setStep("form")}>← Назад</button>
            <div className="bk-timer">⏳ Время держим за тобой: <b>{mm}:{ss}</b></div>
            <div className="bk-eyebrow">Оплата вводного занятия</div>
            <h1 className="bk-h1" style={{fontSize:23,margin:"8px 0 12px"}}>{slot? fmtFull(slot,tz):""}</h1>
            <div className="bk-price"><b>{PRICE.intro}</b><span className="free">вводное · −50%</span></div>
            <p className="bk-p">Слот закрепится за тобой только после оплаты. Сразу после — письмо со ссылкой на Zoom и файлом для календаря.</p>
            <button className="bk-btn bk-btn-acc" onClick={pay}>Оплатить {PRICE.intro}</button>
            <div className="bk-note">Демо-кнопка. На боевом сайте здесь откроется безопасная оплата Т-Кассы.</div>
          </div>
        )}

        {/* DONE */}
        {step==="done" && (
          <div className="bk-card" style={{textAlign:"center"}}>
            <div className="bk-ok-ic">✓</div>
            <h1 className="bk-h1" style={{fontSize:24}}>Готово, ты записан{form.name?", "+form.name:""}!</h1>
            <div className="bk-row" style={{textAlign:"left"}}>Вводное занятие<br/><b>{slot? fmtFull(slot,tz):""}</b></div>
            <p className="bk-p">Письмо со ссылкой на Zoom и файлом для календаря придёт на <b>{form.email||"почту"}</b>. До встречи!</p>
            <button className="bk-btn bk-ghost" onClick={()=>{ setStep("landing"); setSlot(null); setConsent(false); }}>На главную</button>
          </div>
        )}

        {/* NO SLOTS -> школа */}
        {step==="noslots" && (
          <div className="bk-card" style={{textAlign:"center"}}>
            <div className="bk-eyebrow">Свободных окон нет</div>
            <h1 className="bk-h1">Ближайшие даты пока заняты 🙈</h1>
            <p className="bk-p">У меня сейчас всё расписано. Чтобы не ждать — можно начать в моей школе Chill Education: те же принципы, проверенные преподаватели, свободные места есть.</p>
            <button className="bk-btn" onClick={goSchool}>Записаться в школу Chill Education →</button>
            <div style={{margin:"18px 0 6px",fontSize:13,color:"#5A5F7D"}}>или оставь почту — напишу, когда появится окно у меня:</div>
            <WaitList />
          </div>
        )}
      </div>

      {/* демо-переключатель (только для прототипа) */}
      <div className="bk-demo">
        Прототип · демо-данные
        <button onClick={()=>{ setForceNoSlots(v=>!v); setStep(!forceNoSlots?"noslots":"landing"); }}>
          {forceNoSlots? "Показать со слотами":"Показать «нет слотов»"}
        </button>
      </div>
    </div>
  );
}

function WaitList(){
  const [v,setV]=useState(""); const [ok,setOk]=useState(false);
  if(ok) return <div style={{color:"#1FA85A",fontWeight:600,fontSize:14}}>✓ Записал, напишу как появится окно.</div>;
  return (
    <form onSubmit={e=>{e.preventDefault(); if(!v.trim())return; track("waitlist_join"); setOk(true);}} style={{display:"flex",gap:8}}>
      <input className="bk-inp" type="email" required value={v} onChange={e=>setV(e.target.value)} placeholder="you@mail.ru" style={{flex:1}} />
      <button className="bk-btn" type="submit" style={{width:"auto",padding:"12px 16px"}}>Жду</button>
    </form>
  );
}

document.getElementById("boot").style.display="none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
