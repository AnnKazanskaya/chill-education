/* демо-слоты, время по МСК (Europe/Moscow), ручная отметка эмулируется */
function buildSlots(){
  const now=Date.now(), LAG=12*3600*1000;
  const hoursUTC=[9,10,11,14,15,16]; // рабочие часы владельца
  const out=[]; const base=new Date(); base.setUTCHours(0,0,0,0);
  for(let d=0;d<14;d++){
    const day=new Date(base.getTime()+d*86400000), dow=day.getUTCDay(), slots=[];
    if(dow!==0&&dow!==6){
      hoursUTC.forEach((h,i)=>{
        const t=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h);
        if(t<now+LAG) return;
        if(((d*5+i*3)%10)<4) return; // ~40% занято
        slots.push(t);
      });
    }
    out.push({ts:day.getTime(),slots});
  }
  return out;
}

              <div className="gcell"><div className="gl">Как работали</div><div className="gv">{STORIES[story].work}</div></div>
              <div className="gcell ab"><div className="gl">Точка А</div><div className="gv">{STORIES[story].a}</div></div>
              <div className="gcell b"><div className="gl">Точка Б</div><div className="gv">{STORIES[story].b}</div></div>
            </div>
          </div>

          {/* Правила (сворачиваемо) */}
          <details className="acc">
            <summary>Правила <span className="muted" style={{fontWeight:600,fontSize:13}}>развернуть</span></summary>
            <div className="body">
              <ul className="list">
                <li>Уроки в Zoom, материалы на платформе. Урок 45–50 минут.</li>
                <li>Отмена или перенос в день урока — урок считается проведённым.</li>
                <li>Если урок отменяю я в тот же день — тебе начисляется дополнительный.</li>
                <li>Не вышел на связь 15 минут и не предупредил — урок считается проведённым.</li>
                <li>Свободное время закрепляется за тобой на 2 недели.</li>
                <li>Цена меняется дважды в год на 10% (сентябрь и декабрь).</li>
                <li>Решил закончить — предупреди за 2 недели, чтобы я спланировал расписание.</li>
              </ul>
            </div>
          </details>

          <button className="btn btn-acc" onClick={startBooking}>Выбрать время для вводного</button>
        </>)}

        {/* ================= Экран 5 — выбор времени ================= */}
        {flow==="slots" && (
          <div className="card">
            <button className="back" onClick={()=>setFlow(null)}>← На главную</button>
            <div className="step">Шаг 1 из 3 · выбор времени</div>
            <h2 className="h2">Выбери удобное время</h2>
            <div className="tznote">🕒 Время указано по Москве (МСК).</div>
            <div className="days">
              {days.map((d,i)=>(
                <div key={d.ts} className={"day"+(i===dayIdx?" sel":"")+(d.slots.length?"":" empty")} onClick={()=>d.slots.length&&setDayIdx(i)}>
                  <div className="dw">{fW(d.ts)}</div><div className="dd">{fD(d.ts)}</div>
                  <div className="dn">{d.slots.length?d.slots.length+" ок.":"—"}</div>
                </div>
              ))}
            </div>
            {days[dayIdx]&&days[dayIdx].slots.length?(
              <div className="slots">{days[dayIdx].slots.map(ts=><div key={ts} className="slot" onClick={()=>pickSlot(ts)}>{fT(ts)}</div>)}</div>
            ):<p className="p muted" style={{textAlign:"center"}}>Выбери день со свободными окнами</p>}
          </div>
        )}

        {/* ================= Экран 6 — пара вопросов ================= */}
        {flow==="questions" && (
          <div className="card">
            <button className="back" onClick={()=>setFlow("slots")}>← Другое время</button>
            <div className="timer">⏳ Время держим за тобой: <b>{mm}:{ss}</b></div>
            <div className="rowc">Вводное занятие · <b>{slot?fFull(slot):""}</b></div>
            <h2 className="h2">Пара вопросов перед стартом</h2>
            <p className="p muted" style={{marginTop:-4}}>Это поможет мне подготовиться к нашему первому уроку.</p>
            <form onSubmit={submitQ}>
              <div className="lbl">Как ты оцениваешь свой уровень?</div>
              <select className="sel" required value={q.level} onChange={e=>setQ(v=>({...v,level:e.target.value}))}>
                <option value="" disabled>Выбери…</option>
                <option>Начинающий</option><option>A1–A2</option><option>B1–B2</option><option>C1 и выше</option><option>Не знаю</option>
              </select>
              <div className="lbl">Для чего тебе английский?</div>
              <input className="inp" required value={q.why} onChange={e=>setQ(v=>({...v,why:e.target.value}))} placeholder="Работа, путешествия, переезд, для себя…" />
              <div className="lbl">Куда прислать доступы к платформе?</div>
              <input className="inp" required type="email" value={q.email} onChange={e=>setQ(v=>({...v,email:e.target.value}))} placeholder="you@mail.ru" autoComplete="email" />
              <label className="consent">
                <input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)} required />
                <span>Я соглашаюсь с <a href="https://chill.education/policy.html" target="_blank" rel="noopener">политикой конфиденциальности</a> и <a href="https://chill.education/offer.html" target="_blank" rel="noopener">офертой</a></span>
              </label>
              <button className="btn" type="submit" disabled={!consent} style={{marginTop:12}}>Перейти к оплате</button>
            </form>
          </div>
        )}

        {/* ================= Экран 7 — оплата ================= */}
        {flow==="pay" && (
          <div className="card">
            <button className="back" onClick={()=>setFlow("questions")}>← Назад</button>
            <div className="timer">⏳ Время держим за тобой: <b>{mm}:{ss}</b></div>
            <h2 className="h2">Сколько это стоит</h2>
            <div className="cur">
              {Object.keys(PRICES).map(k=><button key={k} className={ccy===k?"on":""} onClick={()=>setCcy(k)}>{PRICES[k].c}</button>)}
            </div>
            <div className="price"><b>{P.intro} {P.c}</b><span className="pill">вводное · −50%</span></div>
            <p className="p muted" style={{marginTop:2}}>Обычный урок — {P.lesson} {P.c}. Вводное — половина цены.</p>
            <div className="rowc">Вводное занятие · <b>{slot?fFull(slot):""}</b></div>
            <div className="subh">Как оплата устроена</div>
            <ul className="list">
              <li>Оплата за месяц вперёд (например, 2 раза в неделю — 8 уроков).</li>
              <li>Оплаченные уроки действуют 2 месяца.</li>
              <li>Слот закрепляется только после оплаты.</li>
            </ul>
            <button className="btn btn-acc" onClick={pay}>Оплатить и записаться</button>
            <button className="contact-btn" onClick={contact}>Связаться — если с оплатой что-то не так</button>
            <div className="note">Демо-кнопка. На боевом сайте здесь откроется безопасная оплата (провайдер уточняется).</div>
          </div>
        )}

        {/* ================= Экран 9 — после оплаты ================= */}
        {flow==="done" && (
          <div className="card" style={{textAlign:"center"}}>
            <div className="ok-ic">✓</div>
            <h2 className="h2">Готово, ты записан!</h2>
            <p className="p">Всё прошло, жду тебя на уроке. Скинул на почту <b>{q.email||"—"}</b> доступ к платформе, ссылку на Zoom и добавил урок в календарь.</p>
            <div className="rowc" style={{textAlign:"left"}}>Вводное занятие<br/><b>{slot?fFull(slot):""}</b></div>
            <div style={{textAlign:"left"}}>
              <div className="subh">Что придёт на почту</div>
              <ul className="list">
                <li>Доступ к интерактивной платформе (логин и пароль)</li>
                <li>Постоянная ссылка на Zoom</li>
                <li>Событие в календарь с датой и временем урока</li>
              </ul>
            </div>
            <p className="note">Перед уроком проверь, что интернет и связь работают стабильно. До встречи!</p>
            <button className="btn btn-ghost" onClick={()=>{setFlow(null);setSlot(null);setConsent(false);}}>На главную</button>
          </div>
        )}

        {/* ================= Нет слотов → школа ================= */}
        {flow==="noslots" && (
          <div className="card" style={{textAlign:"center"}}>
            <button className="back" onClick={()=>setFlow(null)} style={{textAlign:"left",display:"block"}}>← На главную</button>
            <div className="eyebrow">Сейчас всё занято</div>
            <h2 className="h2" style={{marginTop:10}}>Сейчас у меня всё занято</h2>
            <p className="p">У меня ограниченное расписание, и свободные окна бывают не всегда. Но есть преподаватели моей школы — они работают по тем же материалам и той же методике, что и я. Подход будет тот же. Вводный урок у них <b>бесплатный</b>.</p>
            <img src="https://chill.education/img/cta-mascot.png" alt="" style={{height:120,margin:"4px auto 12px"}} />
            <button className="btn" onClick={goSchool}>Записаться к преподавателям школы →</button>
          </div>
        )}
      </div>

      <div className="demo">
        Прототип · демо-данные
        <button onClick={()=>{setForceNo(v=>!v);setFlow(!forceNo?"noslots":null);window.scrollTo(0,0);}}>
          {forceNo?"Показать со слотами":"Показать «нет слотов»"}
        </button>
      </div>
    </div>
  );
}

document.getElementById("boot").style.display="none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
